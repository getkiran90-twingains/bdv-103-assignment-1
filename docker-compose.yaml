services:
  nginx:
    image: nginx
    ports:
      - "8080:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - front-end
      - server1
      - server2
      - server3

  front-end:
    image: ghcr.io/mcmastercce/bvd-103-mcmasterful-books/mcmasterful-books-docker:main
    volumes:
      - ./adapter:/source/adapter

  mongo:
    image: mongo

  server1:
    image: node:20
    working_dir: /app
    volumes:
      - ./:/app
    command: sh -c "npm install && npx tsoa spec-and-routes && npx tsx ./index.ts"
    environment:
      MONGO_URI: mongodb://mongo:27017
    depends_on:
      - mongo

  server2:
    image: node:20
    working_dir: /app
    volumes:
      - ./:/app
    command: sh -c "npm install && npx tsoa spec-and-routes && npx tsx ./index.ts"
    environment:
      MONGO_URI: mongodb://mongo:27017
    depends_on:
      - mongo

  server3:
    image: node:20
    working_dir: /app
    volumes:
      - ./:/app
    command: sh -c "npm install && npx tsoa spec-and-routes && npx tsx ./index.ts"
    environment:
      MONGO_URI: mongodb://mongo:27017
    depends_on:
      - mongo